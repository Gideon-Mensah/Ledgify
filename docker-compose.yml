services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgify
      POSTGRES_USER: ledgify
      POSTGRES_PASSWORD: local-production-test-only
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ledgify"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./accounting-backend
    environment:
      DJANGO_SECRET_KEY: local-compose-secret-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,backend
      DATABASE_URL: postgresql://ledgify:local-production-test-only@postgres:5432/ledgify
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
    depends_on: {postgres: {condition: service_healthy}}
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -"
  frontend:
    build: .
    ports: ["8080:80"]
    depends_on: [backend]
volumes: {postgres_data: {}}
