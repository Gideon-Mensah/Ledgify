server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; }
  location /health/ { proxy_pass http://backend:8000; }
  location /ready/ { proxy_pass http://backend:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
